databases:
  - name: quarantine-db
    plan: free
    databaseName: quarantine_facility
    user: quarantine_user

services:
  - type: web
    name: quarantine-backend
    plan: free
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py seed
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quarantine-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-three-tau-16.vercel.app,http://localhost:3000,http://localhost:3001"
      - key: PYTHON_VERSION
        value: "3.11.6"

